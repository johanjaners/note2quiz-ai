services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: note2quiz
      POSTGRES_USER: note2quiz
      POSTGRES_PASSWORD: note2quiz_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U note2quiz -d note2quiz"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - note2quiz-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=note2quiz;Username=note2quiz;Password=note2quiz_dev
      Cors__AllowedOrigins__0: http://localhost:5173
      Clerk__Authority: ${CLERK_AUTHORITY:-https://capital-dragon-71.clerk.accounts.dev}
      Clerk__Audience: ${CLERK_AUDIENCE:-note2quiz-api}
      AzureVision__Endpoint: ${AZURE_VISION_ENDPOINT:-}
      AzureVision__Key: ${AZURE_VISION_KEY:-}
      AzureOpenAI__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      AzureOpenAI__ApiKey: ${AZURE_OPENAI_API_KEY:-}
      AzureOpenAI__DeploymentName: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
    ports:
      - "8080:8080"

volumes:
  note2quiz-postgres:
